<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bai.xin</title>
  <meta name="description" content="我还是个小孩子。我喜欢唱歌、跳舞和运动。学习成绩还不错，是大队委哦。">
  <link rel="canonical" href="https://bai.xin/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --ink: #3a2a26; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 0 0, #ffd8c4 0 180px, transparent 181px),
        radial-gradient(circle at 100% 0, #c9f6ee 0 160px, transparent 161px),
        radial-gradient(circle at 100% 100%, #ffe7a8 0 200px, transparent 201px),
        linear-gradient(180deg, #fff8f4, #f3f9ff);
    }
    main {
      width: min(40rem, calc(100% - 2rem));
      margin: 0 auto;
      padding: 10vh 0 4.5rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 8vw, 3.6rem);
      line-height: 1.05;
      font-weight: 800;
    }
    .who { margin: .7rem 0 1.4rem; font-size: 1.35rem; }
    .likes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .75rem;
      margin: 0 0 1.3rem;
      padding: 0;
      list-style: none;
    }
    .likes li {
      margin: 0;
      padding: 1rem .6rem .9rem;
      border-radius: 1.2rem;
      text-align: center;
      background: #fff;
      box-shadow: 0 10px 24px rgba(80, 40, 20, .07);
    }
    .likes strong { display: block; margin-top: .35rem; font-size: 1.15rem; }
    .likes svg { width: 2.4rem; height: 2.4rem; }
    .sing { color: #e25b4a; }
    .dance { color: #d48900; }
    .sport { color: #0e9a84; }
    .note {
      margin: 0 0 .7rem;
      font-size: 1.2rem;
      line-height: 1.7;
    }
    .trip {
      margin: 1.1rem 0 1.5rem;
      padding: 1rem 1.1rem .95rem;
      border-radius: 1.2rem;
      background: #fff;
      box-shadow: 0 10px 24px rgba(80, 40, 20, .07);
    }
    .trip p { margin: .35rem 0 0; font-size: 1.15rem; line-height: 1.7; }
    .path { display: block; width: 100%; height: 36px; }
    .dad {
      display: inline-block;
      padding: .8rem 1.05rem;
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 10px 24px rgba(80, 40, 20, .08);
      text-decoration: none;
      color: inherit;
      font-size: 1.15rem;
    }
    .dad:hover { color: #e25b4a; }
    .dad small { display: block; margin-top: .15rem; color: #8a6a60; font-size: .95rem; }
    .bday {
      position: relative;
      margin: 1.2rem 0 1.5rem;
      padding: 1rem 1.1rem 1.05rem;
      border-radius: 1.3rem;
      background: #fff;
      box-shadow: 0 12px 28px rgba(80, 40, 20, .08);
      overflow: hidden;
    }
    .bday[hidden] { display: none; }
    .bday-art { display: flex; align-items: flex-end; gap: .8rem; height: 4.6rem; }
    .bday-art svg { height: 4.2rem; width: auto; }
    .bday-text {
      margin: .7rem 0 0;
      font-size: 1.25rem;
      line-height: 1.65;
      font-weight: 700;
    }
    .bday-text b { color: #e25b4a; font-size: 1.55rem; }
    .bday.is-today { background: #fff7fb; }
    .bday.is-today .bday-text { color: #c43b6e; }
    #bday-play {
      margin-top: .85rem;
      border: 0;
      border-radius: 999px;
      padding: .65rem 1.1rem;
      background: #e25b4a;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #bday-play[hidden] { display: none; }
    #bday-play:hover { background: #c94b3c; }
    .confetti span {
      position: absolute;
      width: .55rem;
      height: .55rem;
      border-radius: 50%;
    }
    .confetti span:nth-child(1) { background: #ff7a59; top: .6rem; left: 8%; }
    .confetti span:nth-child(2) { background: #ffc857; top: 1.1rem; right: 12%; }
    .confetti span:nth-child(3) { background: #3dbea5; top: .4rem; right: 28%; }
    .confetti span:nth-child(4) { background: #6eb5ff; top: 1.4rem; left: 22%; }
    .confetti span:nth-child(5) { background: #e25b4a; top: .8rem; right: 42%; }
    @media (max-width: 560px) {
      .likes { gap: .5rem; }
      .likes li { padding: .8rem .3rem .7rem; }
      .likes strong { font-size: 1rem; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .likes li { transition: transform .2s ease; }
      .likes li:hover { transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <main>
    <h1>你好：）</h1>
    <section id="birthday" class="bday" hidden>
      <div class="confetti" hidden><span></span><span></span><span></span><span></span><span></span></div>
      <div class="bday-art" id="bday-soon">
        <svg viewBox="0 0 64 80" aria-hidden="true"><path d="M32 78c-16-14-22-24-22-34a10 10 0 0 1 18-6 10 10 0 0 1 18 6c0 10-6 20-14 34z" fill="#ff7a59"/><path d="M32 78c-8-8-12-16-12-24" fill="none" stroke="#fff" stroke-width="2"/><path d="M32 18c8 0 8-12 0-12" fill="none" stroke="#6eb5ff" stroke-width="3"/></svg>
        <svg viewBox="0 0 64 80" aria-hidden="true"><path d="M32 78c-16-14-22-24-22-34a10 10 0 0 1 18-6 10 10 0 0 1 18 6c0 10-6 20-14 34z" fill="#6eb5ff"/><path d="M32 18c8 0 8-12 0-12" fill="none" stroke="#ffc857" stroke-width="3"/></svg>
        <svg viewBox="0 0 88 72" aria-hidden="true"><path d="M8 32h72l-6 28H14z" fill="#ffc857"/><path d="M8 32c6-10 12 8 18 0s12 8 18 0 12 8 18 0 12 8 18 0v0" fill="none" stroke="#e25b4a" stroke-width="6"/><rect x="40" y="12" width="6" height="16" rx="2" fill="#3dbea5"/><circle cx="43" cy="10" r="3" fill="#ff7a59"/></svg>
      </div>
      <div class="bday-art" id="bday-today" hidden>
        <svg viewBox="0 0 120 72" aria-hidden="true"><path d="M16 34h88l-8 28H24z" fill="#ffc857"/><path d="M16 34c8-12 16 10 24 0s16 10 24 0 16 10 24 0 16 10 16 0" fill="none" stroke="#e25b4a" stroke-width="7"/><rect x="36" y="14" width="5" height="16" rx="2" fill="#3dbea5"/><rect x="58" y="10" width="5" height="20" rx="2" fill="#6eb5ff"/><rect x="80" y="14" width="5" height="16" rx="2" fill="#ff7a59"/><circle cx="38.5" cy="12" r="3" fill="#ff7a59"/><circle cx="60.5" cy="8" r="3" fill="#ffc857"/><circle cx="82.5" cy="12" r="3" fill="#e25b4a"/></svg>
      </div>
      <p class="bday-text" id="bday-text"></p>
      <button type="button" id="bday-play" hidden>一起听</button>
    </section>
    <p class="who">我还是个小孩子，<br>我喜欢唱歌、跳舞和运动。</p>
    <ul class="likes">
      <li class="sing">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="currentColor" d="M18 8h4v20.2A8 8 0 1 1 18 28V8zm4 0 16-4v18.2A8 8 0 1 1 34 22V8.2L22 11V8z"/></svg>
        <strong>唱歌</strong>
      </li>
      <li class="dance">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="30" cy="9" r="4" fill="currentColor"/><path fill="currentColor" d="M28 15c-6 1-10 6-10 12v5h5v-4c0-3 2-6 5-7l4 8 6-3-5-10c-1.6-3-3-4-5-4zM16 36c2 4 8 6 14 4l-2-5c-3 1-7 0-8-2l-4 3z"/></svg>
        <strong>跳舞</strong>
      </li>
      <li class="sport">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="14" fill="none" stroke="currentColor" stroke-width="3"/><path fill="none" stroke="currentColor" stroke-width="3" d="M24 10c4 4 6 9 6 14s-2 10-6 14c-4-4-6-9-6-14s2-10 6-14zM12 20h24M13 28h22"/></svg>
        <strong>运动</strong>
      </li>
    </ul>
    <p class="note">学习成绩还不错，是大队委哦。</p>
    <p class="note">期待着长大，也会留恋美好的童年。</p>
    <div class="trip">
      <svg class="path" viewBox="0 0 320 36" aria-hidden="true">
        <path d="M8 26 C 50 26, 50 8, 90 8 S 140 28, 180 20 240 6, 312 14" fill="none" stroke="#7eb6ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 10"/>
        <circle cx="8" cy="26" r="5" fill="#ff7a59"/>
        <circle cx="90" cy="8" r="5" fill="#ffc857"/>
        <circle cx="180" cy="20" r="5" fill="#3dbea5"/>
        <circle cx="312" cy="14" r="5" fill="#6eb5ff"/>
      </svg>
      <p>我去过很多好玩的地方了，希望将来能够周游世界。</p>
    </div>
    <a class="dad" href="https://gong.cm">这是我爸爸的主页<small>gong.cm</small></a>
  </main>
  <script>
    (function () {
      var parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Shanghai",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date()).split("-").map(Number);
      var y = parts[0], m = parts[1], d = parts[2];
      var today = Date.UTC(y, m - 1, d);
      var thisYear = Date.UTC(y, 9, 17);
      var targetYear = today > thisYear ? y + 1 : y;
      var days = Math.round((Date.UTC(targetYear, 9, 17) - today) / 86400000);
      var box = document.getElementById("birthday");
      if (days > 7) return;
      box.hidden = false;
      var text = document.getElementById("bday-text");
      if (days === 0) {
        box.classList.add("is-today");
        document.getElementById("bday-soon").hidden = true;
        document.getElementById("bday-today").hidden = false;
        document.querySelector(".confetti").hidden = false;
        text.textContent = "哇，今天正好是我的生日，让我们一起听生日快乐歌！";
        var btn = document.getElementById("bday-play");
        btn.hidden = false;
        btn.addEventListener("click", playSong);
      } else {
        text.innerHTML = "距离我的生日还有 <b>" + days + "</b> 天";
      }

      var ctx, stopAt = 0;
      function playSong() {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!ctx) ctx = new AudioCtx();
        if (ctx.state === "suspended") ctx.resume();
        var song = [
          [262, .28], [262, .22], [294, .5], [262, .5], [349, .5], [330, .85],
          [262, .28], [262, .22], [294, .5], [262, .5], [392, .5], [349, .85],
          [262, .28], [262, .22], [523, .5], [440, .5], [349, .45], [330, .45], [294, .85],
          [466, .28], [466, .22], [440, .5], [349, .5], [392, .5], [349, 1]
        ];
        var t = Math.max(ctx.currentTime + .05, stopAt);
        song.forEach(function (note) {
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.value = note[0];
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(.18, t + .03);
          gain.gain.setValueAtTime(.18, t + note[1] * .72);
          gain.gain.linearRampToValueAtTime(0, t + note[1]);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + note[1] + .02);
          t += note[1] + .04;
        });
        stopAt = t;
      }
    })();
  </script>
</body>
</html>
