<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bai.xin</title>
  <meta name="description" content="我还是个小孩子。我喜欢唱歌、跳舞和运动。学习成绩还不错，是大队委哦。">
  <link rel="canonical" href="https://bai.xin/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --ink: #3d2c28;
      --paper: #fffaf6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 8% 12%, #ffd7c2 0 140px, transparent 142px),
        radial-gradient(circle at 92% 8%, #c8f3ea 0 120px, transparent 122px),
        radial-gradient(circle at 86% 92%, #ffe7a3 0 130px, transparent 132px),
        linear-gradient(165deg, #fff8f3, #f4fbff 70%);
    }
    main {
      width: min(34rem, calc(100% - 2rem));
      margin: 0 auto;
      padding: 14vh 0 4rem;
    }
    h1 {
      margin: 0 0 1.1rem;
      font-size: clamp(2.1rem, 7vw, 3.1rem);
      line-height: 1.15;
      font-weight: 800;
    }
    p {
      margin: 0 0 .85rem;
      font-size: 1.25rem;
      line-height: 1.75;
    }
    .sing { color: #e25b4a; font-weight: 700; }
    .dance { color: #d18a00; font-weight: 700; }
    .sport { color: #0f9d86; font-weight: 700; }
    .dad {
      display: inline-block;
      margin-top: 1.1rem;
      padding: .75rem 1rem;
      background: var(--paper);
      border-radius: 1rem;
      box-shadow: 0 10px 28px rgba(90, 40, 20, .08);
      text-decoration: none;
      color: inherit;
    }
    .dad:hover { color: #e25b4a; }
    .dad small {
      display: block;
      margin-top: .15rem;
      color: #8a6a60;
      font-size: .95rem;
    }
    .after { margin-top: 1.4rem; }
  </style>
</head>
<body>
  <main>
    <h1>你好：）</h1>
    <p>我还是个小孩子，</p>
    <p>我喜欢<span class="sing">唱歌</span>、<span class="dance">跳舞</span>和<span class="sport">运动</span>。</p>
    <p>学习成绩还不错，是大队委哦。</p>
    <a class="dad" href="https://gong.cm">这是我爸爸的主页<small>gong.cm</small></a>
    <p class="after">期待着长大，也会留恋美好的童年。</p>
    <p>我去过很多好玩的地方了，希望将来能够周游世界。</p>
  </main>
</body>
</html>
